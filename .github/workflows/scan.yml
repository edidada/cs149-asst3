name: CS149 CUDA Scan and Repeats
on:
  push:
    branches: [edidada/scan]
  workflow_dispatch:
    inputs:
      gpu:
        description: Run real device tests on a registered self-hosted Linux GPU runner
        type: boolean
        default: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    timeout-minutes: 20
    steps:
      - name: Install build and checkout dependencies
        run: apt-get update -qq && apt-get install -y -qq make g++ git
      - uses: actions/checkout@v4
      - name: Build original application and independent checks (no GPU execution)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > evidence/commit.txt
          nvcc --version | tee evidence/toolchain.txt
          make -C scan 2>&1 | tee evidence/build.txt
          nvcc -O3 -std=c++14 -arch=sm_75 -Iscan tests/scan_boundaries.cu scan/scan.cu -o /tmp/scan-boundaries 2>&1 | tee evidence/boundaries-build.txt
          echo 'COMPILE ONLY: no GPU runtime or performance conclusion' | tee evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-compile-evidence
          path: evidence
  device:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Real device correctness and memory checking
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          nvidia-smi | tee evidence/device.txt
          nvcc --version | tee evidence/toolchain.txt
          make -C scan
          nvcc -O3 -std=c++14 -arch=sm_75 -Iscan tests/scan_boundaries.cu scan/scan.cu -o /tmp/scan-boundaries
          timeout 180 compute-sanitizer --tool memcheck --error-exitcode 1 /tmp/scan-boundaries 2>&1 | tee evidence/correctness.txt
          cd scan
          timeout 600 python3 checker.py scan 2>&1 | tee ../evidence/original-scan.txt
          cp -r logs ../evidence/scan-logs
          timeout 600 python3 checker.py find_repeats 2>&1 | tee ../evidence/original-repeats.txt
          cp -r logs ../evidence/repeats-logs
          python3 -c 'from pathlib import Path; logs=[Path("../evidence/original-"+name+".txt").read_text() for name in ("scan","repeats")]; assert all(s.count("Correctness passed!")==4 and "Correctness failed" not in s for s in logs)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-device-evidence
          path: evidence
