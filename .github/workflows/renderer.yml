name: CS149 CUDA Renderer
on:
  push:
    branches: [edidada/renderer]
  workflow_dispatch:
    inputs:
      gpu:
        description: Run real device tests on a registered self-hosted Linux GPU runner
        type: boolean
        default: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    timeout-minutes: 20
    steps:
      - name: Install build and checkout dependencies
        run: apt-get update -qq && apt-get install -y -qq make g++ git libgl1-mesa-dev freeglut3-dev
      - uses: actions/checkout@v4
      - name: Build original application and independent checks (no GPU execution)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > evidence/commit.txt
          nvcc --version | tee evidence/toolchain.txt
          make -C render 2>&1 | tee evidence/build.txt
          g++ -O3 -std=c++11 -Irender tests/renderer_boundaries.cpp render/objs/cudaRenderer.o render/objs/refRenderer.o render/objs/noise.o render/objs/sceneLoader.o -L/usr/local/cuda/lib64 -lcudart -o /tmp/renderer-boundaries
          echo 'COMPILE ONLY: no GPU runtime or performance conclusion' | tee evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-compile-evidence
          path: evidence
  device:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Real device correctness and memory checking
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          nvidia-smi | tee evidence/device.txt
          nvcc --version | tee evidence/toolchain.txt
          make -C render
          g++ -O3 -std=c++11 -Irender tests/renderer_boundaries.cpp render/objs/cudaRenderer.o render/objs/refRenderer.o render/objs/noise.o render/objs/sceneLoader.o -L/usr/local/cuda/lib64 -lcudart -o /tmp/renderer-boundaries
          timeout 300 compute-sanitizer --tool memcheck --error-exitcode 1 /tmp/renderer-boundaries 2>&1 | tee evidence/non-square-animated.txt
          for scene in rgb rgby rand10k pattern snowsingle biglittle littlebig; do
            for size in 1 15 16 17 31 65; do
              timeout 120 compute-sanitizer --tool memcheck --error-exitcode 1 render/render -c "$scene" -s "$size" -S 17 -f /tmp/render-check 2>&1 | tee "evidence/$scene-$size.txt"
              grep -q 'Correctness check passed' "evidence/$scene-$size.txt"
            done
          done
          cd render
          timeout 900 python3 checker.py 2>&1 | tee ../evidence/original-checker.txt
          cp -r logs ../evidence/original-logs
          python3 -c 'from pathlib import Path; logs=list(Path("logs").glob("correctness_*.log")); assert len(logs)==8; assert all("Correctness check passed" in p.read_text() for p in logs)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-device-evidence
          path: evidence
